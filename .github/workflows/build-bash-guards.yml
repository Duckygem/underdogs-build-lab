name: Build clean Bash Guard artwork

on:
  push:
    paths:
      - ".github/workflows/build-bash-guards.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install image tools
        run: |
          npm init -y >/dev/null 2>&1
          npm install sharp >/dev/null 2>&1

      - name: Extract all six Bash Guards from the HQ game sprite
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const sharp=require('sharp');

          const chunks=[
            'images/parts-sprite-opt.00.b64',
            'images/parts-sprite-opt.01.b64',
            'images/parts-sprite-opt.02.b64',
            'images/parts-sprite-opt.03.b64',
            'images/parts-sprite-opt.04.b64'
          ];
          const encoded=chunks.map(f=>fs.readFileSync(f,'utf8').trim()).join('');
          const source=Buffer.from(encoded,'base64');

          const guards=[
            {name:'Bash Bars',file:'bash-bars.png',col:4,row:0},
            {name:'Blast Basher',file:'blast-basher.png',col:0,row:1},
            {name:'Kinoflect Basher',file:'kinoflect-basher.png',col:1,row:1},
            {name:'Plow Basher',file:'plow-basher.png',col:2,row:1},
            {name:'Power Basher',file:'power-basher.png',col:3,row:1},
            {name:'Stun Basher',file:'stun-basher.png',col:4,row:1}
          ];

          function median(values){
            values.sort((a,b)=>a-b);
            return values[Math.floor(values.length/2)]||0;
          }

          async function cleanCell(buf){
            const {data,info}=await sharp(buf).flip().ensureAlpha().raw().toBuffer({resolveWithObject:true});
            const {width:w,height:h,channels}=info;
            const rs=[],gs=[],bs=[];
            const border=Math.max(3,Math.round(Math.min(w,h)*0.025));
            for(let y=0;y<h;y++)for(let x=0;x<w;x++){
              if(x>=border&&x<w-border&&y>=border&&y<h-border)continue;
              const i=(y*w+x)*channels;
              rs.push(data[i]);gs.push(data[i+1]);bs.push(data[i+2]);
            }
            const br=median(rs),bg=median(gs),bb=median(bs);
            const n=w*h,seen=new Uint8Array(n),q=new Int32Array(n);
            let head=0,tail=0;
            const bgish=(p)=>{
              const i=p*channels,r=data[i],g=data[i+1],b=data[i+2];
              const dr=r-br,dg=g-bg,db=b-bb;
              const dist=Math.sqrt(dr*dr+dg*dg+db*db);
              const hi=Math.max(r,g,b),lo=Math.min(r,g,b),chroma=hi-lo;
              return dist<58 || (hi<72&&chroma<34);
            };
            const push=p=>{if(!seen[p]&&bgish(p)){seen[p]=1;q[tail++]=p}};
            for(let x=0;x<w;x++){push(x);push((h-1)*w+x)}
            for(let y=0;y<h;y++){push(y*w);push(y*w+w-1)}
            while(head<tail){
              const p=q[head++],x=p%w,y=(p/w)|0;
              if(x>0)push(p-1);if(x<w-1)push(p+1);if(y>0)push(p-w);if(y<h-1)push(p+w);
            }

            let x0=w,y0=h,x1=-1,y1=-1;
            for(let p=0;p<n;p++){
              const i=p*channels;
              if(seen[p]){data[i+3]=0;continue}
              if(data[i+3]>12){
                const x=p%w,y=(p/w)|0;
                if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
              }
            }
            if(x1<x0||y1<y0)throw new Error('Foreground extraction failed');

            const pad=Math.max(2,Math.round(Math.min(w,h)*0.01));
            x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);
            x1=Math.min(w-1,x1+pad);y1=Math.min(h-1,y1+pad);
            const rgba=await sharp(data,{raw:{width:w,height:h,channels}})
              .extract({left:x0,top:y0,width:x1-x0+1,height:y1-y0+1})
              .png().toBuffer();

            const inner=await sharp(rgba)
              .resize(592,464,{fit:'contain',background:{r:255,g:255,b:255,alpha:1}})
              .flatten({background:'#ffffff'})
              .png().toBuffer();

            return sharp({
              create:{width:640,height:512,channels:4,background:{r:255,g:255,b:255,alpha:1}}
            }).composite([{input:inner,left:24,top:24}]).png().toBuffer();
          }

          (async()=>{
            const meta=await sharp(source).metadata();
            const W=meta.width,H=meta.height;
            if(!W||!H)throw new Error('Could not decode HQ parts sprite');
            fs.mkdirSync('assets/bash-guards',{recursive:true});

            for(const g of guards){
              const x0=Math.round(g.col*W/5),x1=Math.round((g.col+1)*W/5);
              const y0=Math.round(g.row*H/2),y1=Math.round((g.row+1)*H/2);
              const cell=await sharp(source)
                .extract({left:x0,top:y0,width:x1-x0,height:y1-y0})
                .png().toBuffer();
              const clean=await cleanCell(cell);
              fs.writeFileSync(path.join('assets/bash-guards',g.file),clean);
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Use the new Bash Guard images everywhere
        run: |
          python3 <<'PY'
          from pathlib import Path

          p=Path("part-images.js")
          s=p.read_text()

          insert="""const BASH_ICON_FILES={
            'Bash Bars':'assets/bash-guards/bash-bars.png?v=20260921j',
            'Blast Basher':'assets/bash-guards/blast-basher.png?v=20260921j',
            'Kinoflect Basher':'assets/bash-guards/kinoflect-basher.png?v=20260921j',
            'Plow Basher':'assets/bash-guards/plow-basher.png?v=20260921j',
            'Power Basher':'assets/bash-guards/power-basher.png?v=20260921j',
            'Stun Basher':'assets/bash-guards/stun-basher.png?v=20260921j'
          };
          """
          marker="const HQ_PART_CHUNKS=["
          if "const BASH_ICON_FILES=" not in s:
              s=s.replace(marker,insert+"\n"+marker,1)

          old="""function sprite(name,cls=''){
            const p=PART_SPRITES[name];
            if(!p)return '';
            return `<span class="part-sprite ${cls}" data-part="${name}" role="img" aria-label="${name}" style="background-position:${p[0]}% ${p[1]}%"></span>`;
          }"""
          new="""function sprite(name,cls=''){
            if(BASH_ICON_FILES[name])return `<img class="part-image bash-part-image ${cls}" data-part="${name}" src="${BASH_ICON_FILES[name]}" alt="${name}">`;
            const p=PART_SPRITES[name];
            if(!p)return '';
            return `<span class="part-sprite ${cls}" data-part="${name}" role="img" aria-label="${name}" style="background-position:${p[0]}% ${p[1]}%"></span>`;
          }"""
          if old not in s:
              raise SystemExit("sprite() block not found")
          s=s.replace(old,new,1)

          s=s.replace(
            ".part-sprite{display:block;width:100%;height:100%;min-height:74px;background-image:var(--part-sprite);background-repeat:no-repeat;background-size:500% 200%;background-color:#17190f}",
            ".part-sprite{display:block;width:100%;height:100%;min-height:74px;background-image:var(--part-sprite);background-repeat:no-repeat;background-size:500% 200%;background-color:#17190f}\n.part-image{display:block;width:100%;height:100%;min-height:74px;object-fit:contain}.bash-part-image{background:#fff}"
          )
          s=s.replace(
            ".component>.part-sprite{width:74px;height:62px;min-height:62px;margin:2px auto 5px;border:1px solid #55583b}",
            ".component>.part-sprite,.component>.part-image{width:74px;height:62px;min-height:62px;margin:2px auto 5px;border:1px solid #55583b}"
          )
          s=s.replace(
            ".weapon-art>.part-sprite{width:100%;height:100%;min-height:96px}",
            ".weapon-art>.part-sprite,.weapon-art>.part-image{width:100%;height:100%;min-height:96px}"
          )
          s=s.replace(
            ".detail-part-icon{width:min(260px,72vw);height:170px;min-height:170px;margin:8px auto 16px;border:2px solid #72764b}",
            ".detail-part-icon{width:min(260px,72vw);height:170px;min-height:170px;margin:8px auto 16px;border:2px solid #72764b;object-fit:contain;background:#fff}"
          )
          s=s.replace(
            "const old=parent.querySelector(':scope > .part-sprite');",
            "const old=parent.querySelector(':scope > .part-sprite, :scope > .part-image');"
          )
          s=s.replace(
            "const old=box.querySelector(':scope > .part-sprite');",
            "const old=box.querySelector(':scope > .part-sprite, :scope > .part-image');"
          )
          p.write_text(s)

          p=Path("index.html")
          s=p.read_text().replace("part-images.js?v=20260921d","part-images.js?v=20260921j")
          p.write_text(s)
          PY

      - name: Publish
        run: |
          rm -f .github/workflows/build-bash-guards.yml
          git config user.name "DuckyGem Build Lab Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Upgrade all Bash Guard artwork"
          git push
