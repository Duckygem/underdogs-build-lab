name: Build SmartShuffle v1.2 Playlist Polish APK

on:
  push:
    branches:
      - smartshuffle-apk-build
    paths:
      - 'smartshuffle-v12/**'
      - '.github/workflows/build-smartshuffle-v12.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify and unpack v1.2 polished source
        shell: bash
        run: |
          base64 --decode smartshuffle-v12/project.b64 > /tmp/smartshuffle-v12.tar.xz
          echo "3b61e2f8b0a4503bcd82eb43e99606e7cccea40e64c24698c6fcec15501a0449  /tmp/smartshuffle-v12.tar.xz" | sha256sum -c -
          mkdir -p SmartShuffle
          tar -xJf /tmp/smartshuffle-v12.tar.xz -C .
          # Gradle binary is installed by setup-gradle, not by this project's custom wrapper.
          # Remove the unrecognized custom wrapper JAR so validation stays enabled.
          rm -f SmartShuffle/gradle/wrapper/gradle-wrapper.jar

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then echo "SDK manager missing"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore verified SmartShuffle v1.1 signing identity
        id: signing
        uses: actions/cache/restore@v4
        with:
          path: ~/.config/.android/debug.keystore
          key: smartshuffle-v11-debug-signing-2026-v1

      - name: Stop if the original v1.1 signing key is missing or different
        shell: bash
        run: |
          test "${{ steps.signing.outputs.cache-hit }}" = "true" || {
            echo "::error::Signing cache missing. Restore from offline signing backup; NEVER generate a new key."
            exit 1
          }
          test -s "$HOME/.config/.android/debug.keystore"
          actual="$(sha256sum "$HOME/.config/.android/debug.keystore" | cut -d' ' -f1)"
          expected="3faa651577e9a537473a9ff31ac09a19f292f4bd0728b37bac5323ae6fd1e60f"
          test "$actual" = "$expected" || {
            echo "::error::Wrong signing identity. Aborting to protect Android updates."
            exit 1
          }
          echo "Signing identity verified."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile v1.2 Android APK
        working-directory: SmartShuffle
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Export APK signing fingerprint
        working-directory: SmartShuffle
        run: gradle --no-daemon :app:signingReport > ../SmartShuffle-v12-signing.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartShuffle-v1.2-Polished-APK
          path: |
            SmartShuffle/app/build/outputs/apk/debug/app-debug.apk
            SmartShuffle-v12-signing.txt
          if-no-files-found: error
          retention-days: 90
