name: Build SmartShuffle Samsung APK

on:
  push:
    branches:
      - smartshuffle-apk-build
    paths:
      - 'smartshuffle/**'
      - '.github/workflows/build-smartshuffle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4

      - name: Verify packaged source and unpack Android project
        shell: bash
        run: |
          cat smartshuffle/chunk{1..5}.b64 | base64 --decode > /tmp/smartshuffle-source.tar.xz
          echo "61bf10f82e96cdd795d9467054f6cafc3eedfefb2517d020315dffefa2ec1a26  /tmp/smartshuffle-source.tar.xz" | sha256sum -c -
          mkdir -p SmartShuffle
          tar -xJf /tmp/smartshuffle-source.tar.xz -C SmartShuffle
          sed -i 's/; fillViewport = true/; isFillViewport = true/' SmartShuffle/app/src/main/java/com/duckygem/smartshuffle/MainActivity.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform (preinstalled on GitHub runner)
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then echo "Android SDK manager is not installed on runner"; exit 1; fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Reuse app signing identity across rebuilds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: smartshuffle-debug-signing-2026-v1

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Samsung Android APK
        working-directory: SmartShuffle
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Save APK certificate fingerprint
        working-directory: SmartShuffle
        shell: bash
        run: gradle --no-daemon :app:signingReport > ../smartshuffle-signing-report.txt

      - name: Upload installable APK and SHA1 setup info
        uses: actions/upload-artifact@v4
        with:
          name: SmartShuffle-Samsung-APK
          path: |
            SmartShuffle/app/build/outputs/apk/debug/app-debug.apk
            smartshuffle-signing-report.txt
          if-no-files-found: error
          retention-days: 90
