name: Probe RLStats
on:
  push:
    branches: [ ducky-rl-tracker-apk ]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe profile by Epic name
        run: |
          python - <<'PY'
          import urllib.request
          url='https://rlstats.net/profile/Epic/DuckyGem'
          req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
          try:
              with urllib.request.urlopen(req, timeout=25) as r:
                  print('STATUS', r.status)
                  print('FINAL', r.geturl())
                  body=r.read(5000).decode('utf-8','ignore')
                  print('HAS_PROFILE', 'DuckyGem' in body or 'Skill Rating' in body)
                  print(body[:1000].replace('\n',' '))
          except Exception as e:
              print('ERROR', repr(e))
              raise
          PY
