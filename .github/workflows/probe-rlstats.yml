name: Probe RLStats
on:
  push:
    branches: [ ducky-rl-tracker-apk ]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve DuckyGem Epic profile
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,re,html
          data=urllib.parse.urlencode({'username':'DuckyGem','platform':'Epic'}).encode()
          req=urllib.request.Request('https://rlstats.net/profile/',data=data,headers={
            'User-Agent':'Mozilla/5.0',
            'Content-Type':'application/x-www-form-urlencoded',
            'Referer':'https://rlstats.net/profile/'
          })
          with urllib.request.urlopen(req,timeout=30) as r:
              body=r.read().decode('utf-8','ignore')
              print('STATUS',r.status)
              print('FINAL',r.geturl())
              print('LEN',len(body))
              title=re.search(r'<title>(.*?)</title>',body,re.I|re.S)
              print('TITLE',html.unescape(title.group(1).strip()) if title else 'NONE')
              for needle in ['Stats (Total)','Skill Rating','1v1 Duel','2v2 Doubles','3v3 Standard','Tournaments','Heatseeker','Quads','DuckyGem','Not Found','error']:
                  i=body.lower().find(needle.lower())
                  if i>=0:
                      print('\nFOUND',needle,'AT',i)
                      print(re.sub(r'\s+',' ',html.unescape(body[max(0,i-500):i+2500]))[:3000])
          PY
