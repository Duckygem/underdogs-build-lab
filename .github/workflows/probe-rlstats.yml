name: Probe RLStats
on:
  push:
    branches: [ ducky-rl-tracker-apk ]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect profile lookup
        run: |
          python - <<'PY'
          import urllib.request,re,html
          url='https://rlstats.net/profile/'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=25) as r:
              body=r.read().decode('utf-8','ignore')
              print('STATUS',r.status,'LEN',len(body))
              for pat in [r'<form[^>]*>.*?</form>',r'<script[^>]+src=[^>]+>',r'fetch\([^;]+',r'XMLHttpRequest[^;]+',r'profile[^\n]{0,200}']:
                  print('\nPATTERN',pat)
                  found=re.findall(pat,body,re.I|re.S)
                  for x in found[:20]:
                      print(html.unescape(x)[:3000].replace('\n',' '))
          PY
